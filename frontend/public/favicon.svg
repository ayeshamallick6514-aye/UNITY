<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="unityLeftArm" x1="20" y1="20" x2="60" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0052D4" />
      <stop offset="50%" stop-color="#4364F7" />
      <stop offset="100%" stop-color="#6FB1FC" />
    </linearGradient>
    <linearGradient id="unityRightArm" x1="100" y1="20" x2="60" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="60%" stop-color="#00B0FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <linearGradient id="tricolor" x1="0" y1="0" x2="120" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#138808" />
    </linearGradient>
    <filter id="unityShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#08101d" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background App Tile -->
  <rect width="120" height="120" rx="26" fill="#0B1B3D" />

  <!-- Tricolor Accent Top Stripe -->
  <rect x="0" y="0" width="120" height="4" rx="2" fill="url(#tricolor)" />

  <!-- Central Government Assembly Dome & Pillars -->
  <g filter="url(#unityShadow)">
    <!-- Main Dome -->
    <path d="M 60 36 A 14 14 0 0 1 74 50 L 46 50 A 14 14 0 0 1 60 36 Z" fill="#F1F5F9" stroke="#334155" stroke-width="1.5" />
    <!-- Finial Pill -->
    <path d="M 57 36 L 63 36 L 63 34 L 57 34 Z" fill="#94A3B8" />
    <circle cx="60" cy="32" r="2.5" fill="#F8FAFC" />

    <!-- Flagpole & Waving Saffron/Gold Flag -->
    <line x1="60" y1="30" x2="60" y2="18" stroke="#F8FAFC" stroke-width="1.5" />
    <path d="M 60 18 L 74 21.5 L 60 25 Z" fill="#FF9933" />

    <!-- Main Building Base (Front facade with pillars) -->
    <rect x="42" y="50" width="36" height="18" rx="2" fill="#CBD5E1" stroke="#334155" stroke-width="1.5" />
    <!-- Portico Entrance -->
    <rect x="52" y="56" width="16" height="12" rx="1" fill="#F1F5F9" stroke="#334155" stroke-width="1" />
    <!-- Pillars -->
    <line x1="47" y1="50" x2="47" y2="68" stroke="#334155" stroke-width="1.2" />
    <line x1="73" y1="50" x2="73" y2="68" stroke="#334155" stroke-width="1.2" />
    <!-- Side minarets -->
    <rect x="37" y="54" width="5" height="14" rx="1" fill="#94A3B8" />
    <path d="M 37 54 A 2.5 2.5 0 0 1 42 54 Z" fill="#E2E8F0" />
    <rect x="78" y="54" width="5" height="14" rx="1" fill="#94A3B8" />
    <path d="M 78 54 A 2.5 2.5 0 0 1 83 54 Z" fill="#E2E8F0" />
  </g>

  <!-- Left Arm (Blue Gradient) -->
  <path d="M 22 25 C 22 25, 20 62, 35 78 C 50 94, 60 96, 60 96 L 60 88 C 60 88, 52 86, 42 74 C 32 62, 32 25, 32 25 Z" fill="url(#unityLeftArm)" />

  <!-- Right Arm (Green Gradient) -->
  <path d="M 98 25 C 98 25, 100 62, 85 78 C 70 94, 60 96, 60 96 L 60 88 C 60 88, 68 86, 78 74 C 88 62, 88 25, 88 25 Z" fill="url(#unityRightArm)" />

  <!-- Interlocking Fingers at Bottom (White Crisp Lines) -->
  <path d="M 50 82 C 50 82, 53 85, 57 85 C 61 85, 63 82, 63 82" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 47 85 C 47 85, 50 88, 54 88 C 58 88, 60 85, 60 85" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 44 88 C 44 88, 47 91, 51 91 C 55 91, 57 88, 57 88" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 41 91 C 41 91, 44 94, 48 94 C 52 94, 54 91, 54 91" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
</svg>